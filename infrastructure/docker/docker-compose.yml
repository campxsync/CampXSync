version: '3.8'

# =============================================================================
# CampXSync Local Development Orchestration
#
# Prerequisites:
#   Copy template and fill secrets:
#     cp .env.docker.example .env.docker
#
# Usage:
#   docker-compose -f infrastructure/docker/docker-compose.yml up -d
# =============================================================================

# ── Network isolation ─────────────────────────────────────────────────────────
# campxsync-app  : service-to-service communication
# campxsync-data : restricted data tier — only services that need DB/cache access
networks:
  campxsync-app:
    driver: bridge
  campxsync-data:
    driver: bridge

volumes:
  mongo-data:
  redis-data:

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: campxsync-mongodb
    restart: unless-stopped   # 'unless-stopped' is safer than 'always' in dev
    environment:
      # Credentials sourced from .env.docker — never hardcoded here
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: campxsync
    volumes:
      - mongo-data:/data/db
    networks:
      - campxsync-data
    # Only expose MongoDB inside the data network (not on host by default)
    # Uncomment the line below ONLY for local debugging with a GUI tool:
    # ports:
    #   - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.0-alpine
    container_name: campxsync-redis
    restart: unless-stopped
    # requirepass: authenticated access only
    # appendonly yes: AOF persistence (survives container restart)
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - campxsync-data
    # ports:
    #   - "6379:6379"   # Uncomment only for local debugging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── API Gateway ──────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE_PATH: api-gateway
        JAR_FILE: api-gateway-1.0.0-SNAPSHOT.jar
    image: campxsync/api-gateway:${IMAGE_TAG:-dev}
    container_name: campxsync-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Secrets and connection strings from .env.docker — not hardcoded
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - campxsync-app
      - campxsync-data
    # Waits for HEALTHY state, not just container start
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── College Admin Microservice ───────────────────────────────────────────────
  college-admin-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE_PATH: services/college-admin-service
        JAR_FILE: college-admin-service-1.0.0-SNAPSHOT.jar
    image: campxsync/college-admin-service:${IMAGE_TAG:-dev}
    container_name: campxsync-college-admin-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - campxsync-app
      - campxsync-data
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Platform Admin Microservice ──────────────────────────────────────────────
  platform-admin-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.jvm
      args:
        MODULE_PATH: services/platform-admin-service
        JAR_FILE: platform-admin-service-1.0.0-SNAPSHOT.jar
    image: campxsync/platform-admin-service:${IMAGE_TAG:-dev}
    container_name: campxsync-platform-admin-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - campxsync-app
      - campxsync-data
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
