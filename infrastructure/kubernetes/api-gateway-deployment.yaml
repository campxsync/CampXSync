apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: campxsync
  labels:
    # Using consistent Kubernetes recommended label taxonomy throughout
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: campxsync-platform
    app.kubernetes.io/version: "1.0.0"          # Required for canary rollouts & dashboards
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    # FIXED: matchLabels now uses recommended taxonomy (was non-standard 'app:' label)
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: campxsync-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: campxsync-platform
        app.kubernetes.io/version: "1.0.0"
    spec:
      # Pod-level security context: enforces non-root at the pod level
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001          # Matches the campxsync user created in Dockerfile
        fsGroup: 1001
      containers:
        - name: api-gateway
          # FIXED: Never use :latest in production — non-deterministic, non-reproducible.
          # Replace '1.0.0' with the specific image digest or CI-injected tag in production:
          #   image: campxsync/api-gateway@sha256:<digest>
          image: campxsync/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent   # Correct with a pinned version tag
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Container-level security context: defense-in-depth
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL             # Drop all Linux capabilities (principle of least privilege)

          # ── startupProbe ──────────────────────────────────────────────────────
          # ADDED: Critical for JVM services — prevents premature liveness kills during
          # cold start. Gives the pod up to (failureThreshold × periodSeconds) = 150s to start.
          # Only after startupProbe succeeds do readiness/liveness probes activate.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5

          # ── readinessProbe ────────────────────────────────────────────────────
          # FIXED: Uses /actuator/health/readiness (NOT /actuator/health).
          # Controls whether the Service sends traffic to this pod.
          # Fails if upstream dependencies (MongoDB, Redis) are not reachable.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          # ── livenessProbe ─────────────────────────────────────────────────────
          # FIXED: Uses /actuator/health/liveness (NOT /actuator/health).
          # Triggers pod restart ONLY if the JVM deadlocks or becomes completely unresponsive.
          # Should NOT depend on external services — only checks internal JVM state.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3

      # Allow in-flight requests to complete before the pod terminates
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: campxsync
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: campxsync-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http          # FIXED: references named port — decoupled from port number
      protocol: TCP
  selector:
    # FIXED: Consistent with Deployment matchLabels (uses recommended taxonomy)
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: campxsync-platform
---
# =============================================================================
# PodDisruptionBudget
# ADDED: Ensures at least 1 replica stays available during voluntary disruptions
# (e.g., node drain for maintenance). Without this, all pods can be evicted at once.
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: campxsync
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: campxsync-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: campxsync-platform
---
# =============================================================================
# HorizontalPodAutoscaler
# ADDED: Auto-scales the gateway between 2 and 10 replicas based on CPU/memory load.
# Requires metrics-server to be installed in the cluster.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: campxsync
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: campxsync-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # Scale up when average CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80    # Scale up when average memory > 80%
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down (prevents flapping)
