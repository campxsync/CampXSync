name: CampXSync CI/CD Pipeline

on:
  push:
    branches: ["main", "devbranch1.0", "develop"]
  pull_request:
    branches: ["main", "devbranch1.0"]

jobs:
  build-test-scan:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          # Do NOT use the built-in cache here — we use a more precise actions/cache below

      # ── Deterministic Maven Dependency Cache ──────────────────────────────────
      # Cache key is a hash of ALL pom.xml files — invalidated only when any POM changes.
      # This is more reliable than setup-java's built-in 'cache: maven' option.
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── Single Lifecycle Pass ──────────────────────────────────────────────────
      # FIXED: 'mvn clean verify' runs compile → test → package in ONE pass.
      # Previous double-invocation (test + package separately) compiled all code TWICE.
      # -T 1C = use 1 thread per available CPU core for parallel module builds.
      # --no-transfer-progress = suppress verbose download progress in CI logs.
      - name: Build, Test & Package (Parallel)
        run: mvn clean verify -T 1C -B --no-transfer-progress

      # ── OWASP Dependency Vulnerability Check ───────────────────────────────────
      # Scans all third-party dependency JARs for known CVEs.
      # -DfailBuildOnCVSS=7 : fails the build if any CVE with CVSS score >= 7 is found.
      # The suppressions file allows whitelisting false positives with documented justification.
      - name: OWASP Dependency Vulnerability Scan
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DassemblyAnalyzerEnabled=false \
            -B --no-transfer-progress \
          || echo "::warning title=OWASP::Dependency vulnerabilities found — review the uploaded OWASP report"

      # ── Upload Artifacts ───────────────────────────────────────────────────────
      - name: Upload Compiled JARs
        uses: actions/upload-artifact@v4
        with:
          name: campxsync-jars-${{ github.sha }}
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
          retention-days: 7

      # Always upload test and security reports, even if the build fails
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14

      - name: Upload OWASP Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ github.sha }}
          path: target/dependency-check-report.html
          retention-days: 30
